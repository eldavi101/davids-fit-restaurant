services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: equity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}
      POSTGRES_DB: equity_signal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equity -d equity_signal"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    # Credentials come from the environment only, never from the image or the repository.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://equity:${POSTGRES_PASSWORD}@db:5432/equity_signal
      ENABLE_SCHEDULER: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
